modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SKross04/cozy-cookery/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/SKross04/cozy-cookery"
authors="Wannes (SKross04)"
description='''
Immersive, GUI-free cooking. Chop on boards, cook soups and stews in a pot over a stove,
fry in a pan, grind in a mortar, mix dough in a bowl and bake it in a brick oven.
Grow tomatoes, cabbage, onions and garlic (found wild across the world) and serve
hearty meals on plates you eat bite by bite. Beta release: expect changes.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
